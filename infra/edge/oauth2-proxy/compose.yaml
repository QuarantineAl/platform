# infra/edge/oauth2-proxy/compose.yaml — forward-auth sidecar for apps
# with no native OIDC support.
#
# Extracted out of what was previously embedded directly in
# apps/third-party/uptime-kuma/compose.yaml — a reusable piece of edge
# infrastructure, not something specific to any one app. Originally
# single-tenant (one shared instance hardcoded to Uptime Kuma's client/
# redirect/cookie domain); generalized into ONE NAMED SERVICE PER CONSUMER
# when wg-easy became the second app needing forward-auth — each instance
# gets its own profile, own OIDC client env vars, own redirect URL/cookie
# domain, and its own uniquely-named Traefik router + middlewares (Traefik
# aggregates middleware/router definitions project-wide regardless of
# which file declares them, so names must stay unique across every
# instance here). All instances share the one `core.oauth2_proxy.
# cookie_secret` secret — safe to reuse: it only signs each instance's own
# session cookie, scoped by browser same-origin rules to that instance's
# own Host(), never cross-readable between consumers regardless of sharing
# the signing secret.
#
# Adding a THIRD consumer: copy one of the blocks below, rename every
# `-<app>` suffix (service key, container_name, profiles, env var names,
# router/middleware names) to the new app's name, and point
# OAUTH2_PROXY_REDIRECT_URL / the router's Host() at that app's own
# subdomain.
#
# PIN CHECKPOINT: quay.io/oauth2-proxy/oauth2-proxy:v7.15.3 (verified
# 2026-07-26). Confirm before Phase 2.

services:
  oauth2-proxy-uptime-kuma:
    image: quay.io/oauth2-proxy/oauth2-proxy:v7.15.3
    container_name: quarantine-oauth2-proxy-uptime-kuma
    restart: unless-stopped
    profiles: [uptime-kuma]
    environment:
      OAUTH2_PROXY_PROVIDER: oidc
      OAUTH2_PROXY_OIDC_ISSUER_URL: https://auth.${DOMAIN}
      OAUTH2_PROXY_CLIENT_ID: ${OIDC_CLIENT_ID_UPTIME_KUMA}
      OAUTH2_PROXY_CLIENT_SECRET: ${OIDC_CLIENT_SECRET_UPTIME_KUMA}
      OAUTH2_PROXY_COOKIE_SECRET: ${OAUTH2_PROXY_COOKIE_SECRET}
      OAUTH2_PROXY_EMAIL_DOMAINS: "*"
      OAUTH2_PROXY_REVERSE_PROXY: "true"
      OAUTH2_PROXY_HTTP_ADDRESS: 0.0.0.0:4180
      OAUTH2_PROXY_UPSTREAMS: static://202
      OAUTH2_PROXY_REDIRECT_URL: https://status.${DOMAIN}/oauth2/callback
      OAUTH2_PROXY_SET_XAUTHREQUEST: "true"
      OAUTH2_PROXY_SKIP_PROVIDER_BUTTON: "true"
      OAUTH2_PROXY_SCOPE: "openid email profile"
    networks:
      - edge
    # No healthcheck: the image is a static distroless binary with no
    # shell, curl, or wget to probe itself with (confirmed via `docker
    # run --entrypoint sh`, which fails outright). wait_healthy() accepts
    # it once Running.
    labels:
      - traefik.enable=true
      - traefik.http.services.oauth2-proxy-uptime-kuma.loadbalancer.server.port=4180

      - traefik.http.routers.oauth2-proxy-uptime-kuma.rule=Host(`status.${DOMAIN}`) && PathPrefix(`/oauth2/`)
      - traefik.http.routers.oauth2-proxy-uptime-kuma.entrypoints=websecure
      - traefik.http.routers.oauth2-proxy-uptime-kuma.tls=true
      - traefik.http.routers.oauth2-proxy-uptime-kuma.priority=100
      - traefik.http.routers.oauth2-proxy-uptime-kuma.service=oauth2-proxy-uptime-kuma

      - traefik.http.middlewares.oauth2-auth.forwardauth.address=http://oauth2-proxy-uptime-kuma:4180/oauth2/auth
      - traefik.http.middlewares.oauth2-auth.forwardauth.trustForwardHeader=true
      - traefik.http.middlewares.oauth2-auth.forwardauth.authResponseHeaders=X-Auth-Request-User,X-Auth-Request-Email,X-Auth-Request-Groups,Authorization

      - traefik.http.middlewares.oauth2-errors.errors.status=401-403
      - traefik.http.middlewares.oauth2-errors.errors.service=oauth2-proxy-uptime-kuma
      - traefik.http.middlewares.oauth2-errors.errors.query=/oauth2/sign_in?rd={url}
      - traefik.http.middlewares.oauth2-errors.errors.statusRewrites.401=302

  oauth2-proxy-wg-easy:
    image: quay.io/oauth2-proxy/oauth2-proxy:v7.15.3
    container_name: quarantine-oauth2-proxy-wg-easy
    restart: unless-stopped
    profiles: [wg-easy]
    environment:
      OAUTH2_PROXY_PROVIDER: oidc
      OAUTH2_PROXY_OIDC_ISSUER_URL: https://auth.${DOMAIN}
      OAUTH2_PROXY_CLIENT_ID: ${OIDC_CLIENT_ID_WG_EASY}
      OAUTH2_PROXY_CLIENT_SECRET: ${OIDC_CLIENT_SECRET_WG_EASY}
      OAUTH2_PROXY_COOKIE_SECRET: ${OAUTH2_PROXY_COOKIE_SECRET}
      OAUTH2_PROXY_EMAIL_DOMAINS: "*"
      OAUTH2_PROXY_REVERSE_PROXY: "true"
      OAUTH2_PROXY_HTTP_ADDRESS: 0.0.0.0:4180
      OAUTH2_PROXY_UPSTREAMS: static://202
      OAUTH2_PROXY_REDIRECT_URL: https://vpn.${DOMAIN}/oauth2/callback
      OAUTH2_PROXY_SET_XAUTHREQUEST: "true"
      OAUTH2_PROXY_SKIP_PROVIDER_BUTTON: "true"
      OAUTH2_PROXY_SCOPE: "openid email profile"
    networks:
      - edge
    # No healthcheck — same reasoning as oauth2-proxy-uptime-kuma above.
    labels:
      - traefik.enable=true
      - traefik.http.services.oauth2-proxy-wg-easy.loadbalancer.server.port=4180

      - traefik.http.routers.oauth2-proxy-wg-easy.rule=Host(`vpn.${DOMAIN}`) && PathPrefix(`/oauth2/`)
      - traefik.http.routers.oauth2-proxy-wg-easy.entrypoints=websecure
      - traefik.http.routers.oauth2-proxy-wg-easy.tls=true
      - traefik.http.routers.oauth2-proxy-wg-easy.priority=100
      - traefik.http.routers.oauth2-proxy-wg-easy.service=oauth2-proxy-wg-easy

      - traefik.http.middlewares.oauth2-auth-wg-easy.forwardauth.address=http://oauth2-proxy-wg-easy:4180/oauth2/auth
      - traefik.http.middlewares.oauth2-auth-wg-easy.forwardauth.trustForwardHeader=true
      - traefik.http.middlewares.oauth2-auth-wg-easy.forwardauth.authResponseHeaders=X-Auth-Request-User,X-Auth-Request-Email,X-Auth-Request-Groups,Authorization

      - traefik.http.middlewares.oauth2-errors-wg-easy.errors.status=401-403
      - traefik.http.middlewares.oauth2-errors-wg-easy.errors.service=oauth2-proxy-wg-easy
      - traefik.http.middlewares.oauth2-errors-wg-easy.errors.query=/oauth2/sign_in?rd={url}
      - traefik.http.middlewares.oauth2-errors-wg-easy.errors.statusRewrites.401=302

networks:
  edge:
    external: true
