# infra/data/mongo/compose.yaml — shared MongoDB instance.
#
# Currently has exactly one consumer (infra/deploy/komodo/'s Komodo Core),
# but lives under infra/data/ rather than being bundled inside
# infra/deploy/komodo/ — it's a data-tier service like infra/data/postgres/,
# not deployment logic, and a second consumer should be able to reach it
# without reaching into Komodo's folder. Unlike Postgres (decision 4: one
# shared instance, one database + role per app), there's no established
# per-app-database convention here yet since Komodo is the only consumer —
# revisit if a second Mongo-backed component shows up.
#
# `komodo.skip` label: never let Komodo manage its own backing store.
#
# PIN CHECKPOINT: mongo:8.2.12 (verified 2026-08-04). Deliberately NOT the
# newer 8.3.7 — that build refuses to start at all on a host kernel >=
# 6.19 ("MongoDB cannot start: Linux kernel versions 6.19 and newer has a
# known incompatibility with this version of MongoDB", a hardcoded
# startup guard, not a runtime crash — see jira.mongodb.org/browse/
# SERVER-121912). Confirmed empirically against the real prod host
# (kernel 7.0.0-28-generic, Ubuntu 26.04): 8.3.7 refuses to start, with or
# without the community-suggested GLIBC_TUNABLES=glibc.pthread.rseq=0
# workaround (that workaround targets the underlying TCMalloc/rseq crash
# mongod would otherwise hit — irrelevant here since mongod exits before
# ever reaching that code path); 8.2.12 starts cleanly and the
# healthcheck below passes. The guard appears specific to the 8.3.x line;
# re-pin to a newer 8.3.x/8.4.x once one is confirmed to include
# SERVER-125742's fix (removes the guard for kernel >= 7.0.14) AND to
# actually work on whatever kernel is in use at the time — don't assume
# a newer version number alone resolves this without testing again.

services:
  mongo:
    image: mongo:8.2.12
    container_name: quarantine-mongo
    restart: unless-stopped
    profiles: [gitops] # named "komodo" before the follow-up commit that renamed this profile
    command: ["--quiet", "--wiredTigerCacheSizeGB", "0.25"]
    labels:
      komodo.skip: ""
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${KOMODO_DATABASE_USERNAME:-komodo}
      MONGO_INITDB_ROOT_PASSWORD: ${KOMODO_DATABASE_PASSWORD}
    networks:
      - komodo-db
    volumes:
      - mongo-data:/data/db
      - mongo-config:/data/configdb
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

networks:
  komodo-db:
    name: quarantine-komodo-db
    internal: true

volumes:
  mongo-data:
  mongo-config:
