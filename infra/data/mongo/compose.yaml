# infra/data/mongo/compose.yaml — shared MongoDB instance.
#
# Currently has exactly one consumer (infra/deploy/komodo/'s Komodo Core),
# but lives under infra/data/ rather than being bundled inside
# infra/deploy/komodo/ — it's a data-tier service like infra/data/postgres/,
# not deployment logic, and a second consumer should be able to reach it
# without reaching into Komodo's folder. Unlike Postgres (decision 4: one
# shared instance, one database + role per app), there's no established
# per-app-database convention here yet since Komodo is the only consumer —
# revisit if a second Mongo-backed component shows up.
#
# `komodo.skip` label: never let Komodo manage its own backing store.
#
# PIN CHECKPOINT: mongo:8.3.7 (verified 2026-07-26, latest stable at the
# time Komodo's own database choice was confirmed). Confirm before Phase 2.

services:
  mongo:
    image: mongo:8.3.7
    container_name: quarantine-mongo
    restart: unless-stopped
    profiles: [gitops] # named "komodo" before the follow-up commit that renamed this profile
    command: ["--quiet", "--wiredTigerCacheSizeGB", "0.25"]
    labels:
      komodo.skip: ""
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${KOMODO_DATABASE_USERNAME:-komodo}
      MONGO_INITDB_ROOT_PASSWORD: ${KOMODO_DATABASE_PASSWORD}
    networks:
      - komodo-db
    volumes:
      - mongo-data:/data/db
      - mongo-config:/data/configdb
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

networks:
  komodo-db:
    name: quarantine-komodo-db
    internal: true

volumes:
  mongo-data:
  mongo-config:
