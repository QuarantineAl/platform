# infra/deploy/komodo/compose.yaml — GitOps continuous deployment (decision 7).
#
# Every service here carries `profiles: [gitops]` so CLI-mode environments
# (dev, client installs) can omit this entire fragment — `quarantine start`
# only passes `--profile gitops` when GitOps mode is enabled for the
# environment. (This profile was named "komodo" until the follow-up commit
# that renamed it — the Komodo service/container/folder names themselves
# are unaffected, only the profile string changed.) Komodo's own resource
# definitions (which servers/stacks it manages) live in resources/*.toml,
# git-tracked per decision 7.
#
# Database: MongoDB, at infra/data/mongo/ — NOT bundled in this folder.
# Komodo's own docs recommend Mongo as its default backend (confirmed at
# the Phase 1 checkpoint over the FerretDB alternative, despite MongoDB
# shipping under SSPL rather than an OSI-approved license), but the mongo
# instance itself is data-tier infrastructure like infra/data/postgres/,
# not deployment logic — it lives alongside Postgres under infra/data/ and
# is included as its own fragment, entirely separate from the shared
# vectorchord Postgres instance that decision 4 governs.
#
# GitOps secrets handover (decision 7's "document the handover in docs/"):
# Komodo's Stack resources pull this repo independently via git (not by
# reusing the CLI's on-host checkout), so they never see a decrypted
# environments/<env>/.env file — that file is intentionally git-ignored.
# Instead, `quarantine start` registers decrypted values as Komodo
# Variables via its API when GitOps mode is first enabled for an
# environment, and resources/stacks.toml references them as
# `[[VARIABLE_NAME]]` placeholders in each Stack's `environment` block —
# so the committed TOML never contains a secret, only a name. See
# docs/gitops-prod.md for the full handover sequence and its current
# limitations.
#
# PIN CHECKPOINT: ghcr.io/moghtech/komodo-core:2.2.0 +
# ghcr.io/moghtech/komodo-periphery:2.2.0 (verified 2026-07-26). Confirm
# before Phase 2.

services:
  komodo-core:
    image: ghcr.io/moghtech/komodo-core:2.2.0
    container_name: quarantine-komodo-core
    restart: unless-stopped
    profiles: [gitops]
    init: true
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      KOMODO_DATABASE_ADDRESS: mongo:27017
      KOMODO_DATABASE_USERNAME: ${KOMODO_DATABASE_USERNAME:-komodo}
      KOMODO_DATABASE_PASSWORD: ${KOMODO_DATABASE_PASSWORD}
      KOMODO_DATABASE_DB_NAME: komodo
      KOMODO_HOST: https://komodo.${DOMAIN}
      KOMODO_PORT: "9120"
      KOMODO_TITLE: quarantine
      KOMODO_LOCAL_AUTH: "true"
      KOMODO_INIT_ADMIN_USERNAME: ${KOMODO_ADMIN_USERNAME:-admin}
      KOMODO_INIT_ADMIN_PASSWORD: ${KOMODO_ADMIN_PASSWORD}
      KOMODO_DISABLE_USER_REGISTRATION: "true"
      KOMODO_JWT_SECRET: ${KOMODO_JWT_SECRET}
      KOMODO_WEBHOOK_SECRET: ${KOMODO_WEBHOOK_SECRET}
      # the bundled Periphery below self-registers as this environment's
      # first Server resource on startup
      KOMODO_FIRST_SERVER_NAME: primary
    volumes:
      - komodo-keys:/config/keys
      - komodo-backups:/backups
    networks:
      - edge
      - komodo-db
    healthcheck:
      # Komodo Core has no dedicated health route; GET /version is the
      # cheapest always-available, unauthenticated endpoint (confirmed
      # against Komodo's own upstream source, moghtech/komodo, in its
      # Core service's api/mod.rs). The image ships curl, not wget.
      test: ["CMD", "curl", "-fsS", "http://localhost:9120/version"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    labels:
      - traefik.enable=true
      - traefik.http.routers.komodo.rule=Host(`komodo.${DOMAIN}`)
      - traefik.http.routers.komodo.entrypoints=websecure
      - traefik.http.routers.komodo.tls=true
      - traefik.http.services.komodo.loadbalancer.server.port=9120

  komodo-periphery:
    image: ghcr.io/moghtech/komodo-periphery:2.2.0
    container_name: quarantine-komodo-periphery
    restart: unless-stopped
    profiles: [gitops]
    init: true
    depends_on:
      komodo-core:
        condition: service_healthy
    environment:
      # outbound mode: periphery dials core, no inbound port needed
      PERIPHERY_CORE_ADDRESS: ws://komodo-core:9120
      PERIPHERY_CONNECT_AS: primary
      PERIPHERY_ROOT_DIRECTORY: /etc/komodo
    volumes:
      - komodo-keys:/config/keys
      - /var/run/docker.sock:/var/run/docker.sock
      - /proc:/proc
      - /etc/komodo:/etc/komodo
    networks:
      - edge
    # No healthcheck: in outbound mode Periphery only dials Core over
    # WebSocket, it doesn't run its own HTTP listener to probe. Core's
    # `service_healthy` dependency above is what actually gates startup
    # order; wait_healthy() accepts this container once it's Running.

networks:
  edge:
    external: true
  komodo-db:
    # Declared identically in infra/data/mongo/compose.yaml, which owns
    # this network — Compose's `include:` merges same-named network/volume
    # declarations across files into one project.
    name: quarantine-komodo-db
    internal: true

volumes:
  komodo-keys:
  komodo-backups:
