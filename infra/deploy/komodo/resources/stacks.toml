# infra/deploy/komodo/resources/stacks.toml — Komodo Stack + ResourceSync
# definitions for GitOps mode (decision 7).
#
# `repo` below is this repo's real owner/repo (QuarantineAl/platform).
# `git_account = "github"` is not a GitHub identity — it's the NAME to give
# the git provider account when you configure it inside Komodo's own UI
# (Settings -> Git Providers), which is what actually holds the credential
# Komodo uses to clone. The name here and the name you give it in the UI
# must match exactly, or Komodo can't resolve which credential to use.
#
# Ownership rule (decision 7): a stack is managed by exactly ONE of CLI
# mode or GitOps mode at a time. Once a [[stack]] block below targets an
# environment, stop running `quarantine start` against it directly on that
# host — Komodo now owns reconciliation for it. See docs/gitops-prod.md for
# the full CLI -> Komodo handover sequence and how to hand a stack back.
#
# Secrets handover: Komodo pulls this repo independently (via `repo`
# below), so it never sees a decrypted environments/<env>/.env — that file
# is git-ignored on purpose. Values under `environment` referencing
# `[[SOME_NAME]]` are Komodo Variables, not literal secrets: `quarantine
# start` registers each one (decrypted from secrets.sops.yaml) via
# Komodo's API the first time GitOps mode is enabled for an environment,
# and keeps them in sync whenever a provisioner rotates a value. Nothing
# under this path is ever a plaintext credential — only a variable name.
# Full sequence and current limitations: docs/gitops-prod.md.

[[resource_sync]]
name = "quarantine-resources"
description = "syncs Komodo's own server/stack config from this repo"
[resource_sync.config]
git_account = "github"
repo = "QuarantineAl/platform"
branch = "main"
resource_path = ["infra/deploy/komodo/resources/servers.toml", "infra/deploy/komodo/resources/stacks.toml"]
poll_for_updates = true

# --- prod: the canonical GitOps-managed environment (decision 7) ---------
#
# deploy = false FOR NOW, deliberately: Periphery clones this repo into
# its OWN independent checkout, which never has environments/prod/.env
# (gitignored on purpose — see the secrets-handover note above). Letting
# this stack auto-deploy on creation would run `docker compose up -d`
# against that checkout with every ${VAR} unresolved — including the
# already-running Traefik/Postgres/Zitadel/Mongo/Komodo-core containers
# this same profile touches, which could get recreated with blank
# passwords. Flip to true (and re-run the resource sync) only after a
# working .env has been placed in Periphery's actual clone path — see
# docs/gitops-prod.md for the still-unbuilt proper fix (registering
# secrets as Komodo Variables instead of relying on a literal .env file).
[[stack]]
name = "quarantine-prod"
description = "prod environment, reconciled by Komodo from git"
deploy = false
tags = ["prod"]
[stack.config]
server = "primary"
git_account = "github"
repo = "QuarantineAl/platform"
branch = "main"
run_directory = "environments/prod"
file_paths = ["compose.yaml"]
env_file_path = ".env"
# Populated by `quarantine start` from environments/prod/manifest.yaml at
# the time GitOps mode is enabled; edit the manifest and re-run
# `quarantine start` to change which profiles are active here, rather than
# hand-editing this list (it's regenerated, not merged).
extra_args = ["--profile", "gitops"]
poll_for_updates = true
auto_pull = true
webhook_enabled = true
