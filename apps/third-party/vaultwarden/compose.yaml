# apps/third-party/vaultwarden/compose.yaml — vault.${DOMAIN} (catalog.yaml: vaultwarden)
#
# Vaultwarden has NATIVE OIDC/SSO support (SSO_ENABLED, current as of the
# 1.3x series — catalog.yaml: needs_oidc: true, but unlike uptime-kuma/
# lazaretto the OIDC client this provisions is consumed DIRECTLY by
# Vaultwarden itself, never an oauth2-proxy sidecar, and no oauth2-proxy
# block for this app exists in infra/edge/oauth2-proxy/compose.yaml).
#
# Deliberately NOT fronted by forward-auth at all, unlike every other
# needs_oidc app in this catalog: Bitwarden's own clients (browser
# extension, desktop, mobile, CLI) talk to /api, /identity/*, and the
# /notifications websocket hub directly using Bitwarden's wire protocol,
# never through a browser session — a forwardAuth gate in front of the
# whole host would 401 every one of those calls, none of which will ever
# carry an oauth2-proxy session cookie. Same reasoning catalog.yaml's
# portainer entry already names as a legitimate shape ("Portainer CE does
# support pointing its login screen at a generic OIDC provider directly,
# no oauth2-proxy needed") — Vaultwarden is the first app to actually take
# that path, one Traefik router straight to the container.
#
# Callback path, CURRENT release (verified against the upstream wiki and
# the authentik/Authelia integration guides, not an older blog post):
#     https://vault.${DOMAIN}/identity/connect/oidc-signin
# Several older tutorials reference /sso/callback or /oidc/callback —
# both 404 on current Vaultwarden. This is also why Vaultwarden's own
# `DOMAIN` env var below must be the FULL vault origin
# (https://vault.${DOMAIN}), not this platform's bare ${DOMAIN} — the
# callback URL is derived from it, and getting this wrong produces a
# redirect_uri Zitadel never registered.
#
# Websocket live-sync notifications ship on this SAME port since the
# Rocket 0.5 rewrite — older docs describing a second published port
# (3012) for this are stale; nothing extra is exposed here for it.
#
# SIGNUPS_ALLOWED=false is NOT a complete stop on SSO-driven account
# creation on every release (dani-garcia/vaultwarden#7050, open at time of
# writing: an OIDC login can still provision a new local account for an
# email that has never signed up, regardless of this flag). Treat Zitadel
# itself — who has an account/who's a member of the org this Application
# belongs to — as the real allow-list; this flag still correctly blocks
# the plain email+master-password registration form, which is the other
# half of what it's for.
#
# needs_db: false in catalog.yaml — own SQLite file on a named volume,
# same shape as uptime-kuma. Vaultwarden also supports DATABASE_URL
# against Postgres if you'd rather use the shared instance; that needs
# catalog.yaml's needs_db flipped to true and a DATABASE_URL env var added
# here (postgresql://vaultwarden:${DATABASE_PASSWORD_VAULTWARDEN}@postgres:5432/vaultwarden) —
# not done by default, to keep this app's footprint and failure surface
# (one file vs. a shared server dependency) as small as uptime-kuma's.
#
# PIN CHECKPOINT: vaultwarden/server:1.37.1 (verified 2026-08-20 against
# github.com/dani-garcia/vaultwarden/releases — latest stable). Confirm
# before Phase 2.

services:
  vaultwarden:
    image: vaultwarden/server:${VAULTWARDEN_VERSION:-1.37.1}
    container_name: quarantine-vaultwarden
    restart: unless-stopped
    profiles: [vaultwarden]
    environment:
      # Full origin, not the bare platform ${DOMAIN} — see file header.
      DOMAIN: https://vault.${DOMAIN}

      # Classic email+master-password registration form. Off from first
      # boot: the first account is created via SSO login (Zitadel-side
      # user must already exist — quarantine user add/invite) or via the
      # admin panel's own "Invite User", both of which work with this
      # false. See file header for the SSO-signup caveat this does NOT
      # cover.
      SIGNUPS_ALLOWED: "false"

      SSO_ENABLED: "true"
      # false (not true) deliberately: the master password is what
      # actually encrypts this user's vault client-side, independent of
      # how they authenticate — SSO here only replaces the login step, not
      # vault decryption (Vaultwarden has no Key Connector equivalent).
      # Losing Zitadel access before this is proven working end-to-end
      # would lock everyone out of even attempting a login; keep both
      # paths available until real logins from every client (web vault,
      # browser extension, mobile) are confirmed, then revisit.
      SSO_ONLY: "false"
      # Must match Zitadel's issuer EXACTLY, including absence of a
      # trailing slash (SSO_AUTHORITY has to equal the discovery
      # document's own `issuer` field character-for-character) — same
      # issuer every oauth2-proxy instance in this repo already points at.
      SSO_AUTHORITY: https://auth.${DOMAIN}
      SSO_CLIENT_ID: ${OIDC_CLIENT_ID_VAULTWARDEN}
      SSO_CLIENT_SECRET: ${OIDC_CLIENT_SECRET_VAULTWARDEN}
      # openid is implicit; explicit here even though it matches
      # Vaultwarden's own default, so a future default change upstream
      # can't silently narrow what this deployment requests.
      SSO_SCOPES: "email profile"
      # Default true, set explicitly: Vaultwarden's SSO flow requires PKCE
      # on the authorization code exchange regardless of Zitadel's own
      # client settings.
      SSO_PKCE: "true"
      # Links an SSO login to an existing LOCAL account by matching email,
      # instead of always minting a new one — the sane default for a
      # single-user-per-email deployment.
      SSO_SIGNUPS_MATCH_EMAIL: "true"

      # PHC-format Argon2 hash (starts with $argon2id$), never a plain
      # string — see docs (backup/restore doc in the deployment writeup)
      # for how this is generated. Vaultwarden auto-detects the PHC shape
      # and verifies via Argon2 instead of a plaintext compare.
      ADMIN_TOKEN: ${VAULTWARDEN_ADMIN_TOKEN}
    networks:
      - edge
    volumes:
      - vaultwarden-data:/data
    healthcheck:
      # /alive is unauthenticated and needs neither ADMIN_TOKEN nor an SSO
      # session — just liveness of the web server itself.
      test: ["CMD-SHELL", "wget -qO- --no-verbose --tries=1 http://localhost/alive || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    labels:
      - traefik.enable=true
      - traefik.http.services.vaultwarden.loadbalancer.server.port=80

      # Single router, whole host: every path (/, /api, /identity,
      # /notifications/hub, /admin) is reachable straight from Traefik —
      # see file header for why this app is not split into a public/admin
      # pair the way uptime-kuma is, or gated by oauth2-proxy the way
      # every other needs_oidc app here is. Vaultwarden does its own
      # authorization on every route, including /admin (ADMIN_TOKEN).
      - traefik.http.routers.vaultwarden.rule=Host(`vault.${DOMAIN}`)
      - traefik.http.routers.vaultwarden.entrypoints=websecure
      - traefik.http.routers.vaultwarden.tls=true
      - traefik.http.routers.vaultwarden.service=vaultwarden

      # Optional extra layer on top of ADMIN_TOKEN: restrict /admin to a
      # known set of source IPs (office network, VPN, admin's own
      # /32) at the edge, before the request ever reaches Vaultwarden.
      # Commented out — fill in real CIDRs and uncomment to enable; a
      # wrong/empty sourceRange here would lock everyone out of /admin,
      # so this is left as an explicit opt-in rather than a default.
      # - traefik.http.middlewares.vaultwarden-admin-allowlist.ipallowlist.sourcerange=203.0.113.0/24,198.51.100.7/32
      # - traefik.http.routers.vaultwarden-admin.rule=Host(`vault.${DOMAIN}`) && PathPrefix(`/admin`)
      # - traefik.http.routers.vaultwarden-admin.entrypoints=websecure
      # - traefik.http.routers.vaultwarden-admin.tls=true
      # - traefik.http.routers.vaultwarden-admin.priority=100
      # - traefik.http.routers.vaultwarden-admin.middlewares=vaultwarden-admin-allowlist
      # - traefik.http.routers.vaultwarden-admin.service=vaultwarden

networks:
  edge:
    external: true

volumes:
  vaultwarden-data:
