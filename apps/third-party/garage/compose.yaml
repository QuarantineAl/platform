# apps/third-party/garage/compose.yaml — s3.${DOMAIN} (catalog.yaml: garage)
#
# Garage is the platform's S3-compatible object storage. Apps that set
# `needs_bucket: true` in catalog.yaml get their own bucket and access key
# from provisioners/garage.sh, and talk to it at http://garage:3900 over the
# edge network. Browsers and outside clients use https://s3.${DOMAIN}.
#
# Things to know:
# - Single node, one copy of each object. Back the volumes up off-host.
# - Path-style URLs only (https://s3.${DOMAIN}/<bucket>/<key>). Set
#   forcePathStyle: true (or the SDK's equivalent) and region "garage".
# - Web UI: the separate garage-ui catalog app. Or the CLI:
#   docker exec quarantine-garage /garage <command>
# - Object data lives on its own disk, mounted on the host at
#   /srv/quarantine/garage-data (see the volume at the bottom). It is still a
#   named volume, so `quarantine backup` picks it up.
# - The image has no shell, so the healthcheck runs the garage binary itself.
#
# PIN CHECKPOINT: dxflrs/garage:v2.5.0 (latest stable, 2026-10-24). v2.3.0+
# is required for `server --single-node`.

services:
  garage:
    image: dxflrs/garage:${GARAGE_VERSION:-v2.5.0}
    container_name: quarantine-garage
    restart: unless-stopped
    # The process can never gain more rights than it started with.
    security_opt:
      - no-new-privileges:true
    profiles: [garage]
    # Creates the single-node cluster layout on first boot.
    command: ["/garage", "server", "--single-node"]
    environment:
      GARAGE_RPC_SECRET: ${GARAGE_RPC_SECRET}
      GARAGE_ADMIN_TOKEN: ${GARAGE_ADMIN_TOKEN}
      GARAGE_METRICS_TOKEN: ${GARAGE_METRICS_TOKEN}
    # Idle use is tens of MiB; this leaves room for large multipart uploads.
    mem_limit: 512m
    networks:
      - edge
      # Private link to garage-ui for the admin API.
      - garage-admin
    volumes:
      - ./garage.toml:/etc/garage.toml:ro
      - garage-meta:/var/lib/garage/meta
      - garage-data:/var/lib/garage/data
    healthcheck:
      test: ["CMD", "/garage", "status"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    labels:
      - traefik.enable=true
      - traefik.http.services.garage.loadbalancer.server.port=3900
      # No forward-auth: every S3 request is signed with the app's own key,
      # and presigned URLs must work from a plain browser.
      - traefik.http.routers.garage.rule=Host(`s3.${DOMAIN}`)
      - traefik.http.routers.garage.entrypoints=websecure
      - traefik.http.routers.garage.tls=true
      - traefik.http.routers.garage.service=garage

networks:
  edge:
    external: true
  garage-admin:
    name: quarantine-garage-admin
    internal: true

volumes:
  garage-meta:
  # A named volume whose files sit on the host's dedicated Garage disk, so
  # a full bucket can never fill the VM's root disk. The directory must
  # exist before Garage starts: see docs/site/guides/apps/garage.md.
  garage-data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /srv/quarantine/garage-data
