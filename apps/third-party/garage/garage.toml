# Garage config for a single-node install (catalog.yaml: garage).
#
# Secrets are NOT in this file. Garage reads them from the environment:
# GARAGE_RPC_SECRET, GARAGE_ADMIN_TOKEN and GARAGE_METRICS_TOKEN, which
# compose.yaml fills in from secrets.sops.yaml.

metadata_dir = "/var/lib/garage/meta"
data_dir = "/var/lib/garage/data"
db_engine = "lmdb"

# One copy of every object. There is no second node to copy to, so this
# is the only valid value here. Off-host backups are the real safety net.
replication_factor = 1

# Node-to-node traffic. With one node nothing else needs to reach it, so it
# stays inside the container.
rpc_bind_addr = "127.0.0.1:3901"
rpc_public_addr = "127.0.0.1:3901"

[s3_api]
# Any string works; clients must send the same one. "garage" is the usual.
s3_region = "garage"
api_bind_addr = "[::]:3900"

[admin]
# Admin API and metrics stay inside the container. Operators use the
# `garage` CLI through `docker exec` instead.
api_bind_addr = "127.0.0.1:3903"
