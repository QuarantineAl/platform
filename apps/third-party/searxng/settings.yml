# apps/third-party/searxng/settings.yml — mounted at /etc/searxng/settings.yml
#
# `use_default_settings: true` means this file is an *overlay*: everything not
# named here keeps the image's own default, so upgrading the image picks up new
# engines and fixes instead of freezing whatever the defaults looked like on
# the day this was written. Only the three deviations below are ours.
#
# The container's entrypoint only writes a settings.yml from its template when
# one does not already exist, so mounting this file wins outright — including
# over the entrypoint's `ultrasecretkey` substitution, which is why the secret
# comes from the environment instead (see server.secret_key below).
use_default_settings: true

server:
  # NOT set here. searx/settings_defaults.py declares secret_key with
  # environ_name='SEARXNG_SECRET', so the value arrives from the environment
  # and never lands in a file in this repo or on the host's disk. The platform
  # generates and persists it via catalog.yaml's generated_secrets.

  # Off because this instance is not internet-facing: it listens only on the
  # internal `edge` network and is reachable solely by Lazaretto's MCP search
  # server. The limiter is SearXNG's bot defence and it rejects exactly the
  # traffic we want — programmatic, no browser cookies — with 403s. Leaving it
  # on is the single most common reason a self-hosted SearXNG returns 403 to
  # an API client.
  #
  # This is safe ONLY as long as nothing routes this container through
  # Traefik. If it is ever given a Host() rule, turn this back on and add the
  # valkey/redis the limiter needs for its counters.
  limiter: false

search:
  # The whole reason this app exists. The image ships `formats: [html]` and
  # leaves json commented out (verified against
  # /usr/local/searxng/searx/settings.yml in the pinned image), so without
  # this override every API call comes back as a web page and the tool loop
  # silently gets nothing useful.
  formats:
    - html
    - json

# Engines that answer from a datacenter IP.
#
# SearXNG's enabled-by-default general engines are all scrapers, and they all
# block this host. Measured on prod, not guessed:
#
#   brave       Suspended: too many requests
#   duckduckgo  CAPTCHA
#   google cse  Suspended: too many requests
#   startpage   Suspended: CAPTCHA
#
# With every one of them refusing, a search returns zero results and the tool
# loop dutifully reports "No results found" — which is what a user saw. This
# had been degrading quietly: an hour earlier duckduckgo alone was still
# answering, which looked fine and left no redundancy at all.
#
# Every engine below was picked by running it against this host's own IP in
# a throwaway instance and keeping only the ones that actually returned
# results. Free, no API key, no signup. Result counts at the time of
# measurement, for one query:
#
#   mwmbl 51 · yandex 15 · encyclosearch 15 · bing 10 · duckduckgo web 10
#   yacy 10 · zapmeta 9 · seznam 6
#
# Measured and rejected: yahoo (HTTP protocol error), baidu/sogou/qwant
# (CAPTCHA), dogpile/fireball/yep (access denied), and mojeek, crowdview and
# searchmysite — which answered without error but contributed nothing, so
# they would only add latency to every query.
#
# `duckduckgo web` is not a typo for `duckduckgo`. They are separate
# implementations against different endpoints, and only the plain one is
# CAPTCHA-blocked here — so this is free coverage that the default set does
# not get.
#
# Chosen for INDEPENDENCE as much as for volume: yandex, mwmbl, yacy and
# bing run their own crawlers and share no infrastructure, so they cannot
# all start refusing at once the way the shipped default set did — every one
# of which was blocked simultaneously, taking search to zero.
#
# The blocked defaults stay enabled on purpose: suspensions expire and they
# rejoin whenever they are willing to. brave already came back this way.
# This is a floor under them, not a replacement.
#
# bing and yandex are scraped and can block again in time. The durable
# answer is a keyed API engine — google cse with a real api_key/engine_id,
# or a Brave Search API key, both of which have free tiers — but that is a
# per-deployment credential decision rather than something to hardcode here.
# mwmbl and yacy have their own APIs and are the least likely to refuse.
engines:
  - name: bing
    disabled: false
  - name: mwmbl
    disabled: false
  - name: seznam
    disabled: false
  - name: duckduckgo web
    disabled: false
  - name: yandex
    disabled: false
  - name: encyclosearch
    disabled: false
  - name: yacy
    disabled: false
  - name: zapmeta
    disabled: false
