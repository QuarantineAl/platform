# apps/first-party/lazaretto/compose.yaml — ${SUBDOMAIN:-lazaretto}.${DOMAIN}
# (catalog.yaml: lazaretto)
#
# Two services, two hostnames — mirrors the frontend/-api split lazaretto's
# own DOCKER.md documents for its manual deployment. VITE_API_BASE is baked
# into the frontend image at CI build time by rewriting
# frontend/.env.production before `docker build` (lazaretto/frontend/
# Dockerfile deliberately reads only that file, never a build ARG/ENV — an
# already-set process.env value, even empty, would silently win over it) —
# that rewrite is the calling CI workflow's job, not this fragment's.
#
# SUBDOMAIN defaults to "lazaretto" for the persistent catalog deployment
# (quarantine app add lazaretto / quarantine start) but is overridden per
# invocation for a PR sandbox (pr-<n>-lazaretto), so this ONE fragment
# serves both — see docs/runners-and-sandboxing.md's per-PR section. The
# `profiles: [lazaretto]` gate is a STATIC app-identity label (matches
# catalog.yaml's name, independent of which SUBDOMAIN a given invocation
# uses) — any invocation of this file, catalog or PR sandbox, must pass
# `--profile lazaretto` or these services never start.
#
# No database (own SQLite volume, catalog.yaml: needs_db: false).
# needs_oidc: true — fronted by a PER-SUBDOMAIN oauth2-proxy-lazaretto
# sidecar (infra/edge/oauth2-proxy/compose.yaml, brought up alongside this
# file with the same SUBDOMAIN/DOMAIN — see that file's own header and
# QuarantineAl/.github's pr-sandbox-up.yml), closing lazaretto's own
# ARCHITECTURE.md-documented "no auth" gap. Both routers below are gated
# wholesale (no public/admin split like uptime-kuma's — lazaretto has no
# legitimate unauthenticated path), and the backend independently verifies
# the forwarded ID token itself (AUTH_MODE=required below) as defense in
# depth. See docs/adding-oidc-to-your-app.md for the full recipe this
# follows, and lazaretto's own docs/USER_MANAGEMENT_OIDC_ZITADEL.md for the
# app-side implementation this wires up to.

services:
  lazaretto-backend:
    image: ghcr.io/quarantineal/lazaretto-backend:${LAZARETTO_VERSION:-CHANGEME}
    container_name: quarantine-${SUBDOMAIN:-lazaretto}-backend
    restart: unless-stopped
    profiles: [lazaretto]
    networks:
      - edge
    volumes:
      - lazaretto-data:/app/data
    # Per-instance resource ceilings. These are re-derived from PRODUCTION OOM
    # DATA and replace an earlier set measured on an idle dev host (53 MiB
    # idle, ~173/250 MiB per turn, "four concurrent heavy turns peaked at
    # 999 MiB"). That model was ~2.2x too low and it killed real turns:
    # quarantine-qualitech-lazaretto-backend recorded oom_kill 5 and hit its
    # 1200 MiB ceiling 13,285 times.
    #
    # What the old measurement missed is that it measured turns and nothing
    # else. Reconstructing the kernel's per-task OOM dumps (Sum of per-task
    # rss_anon matches the cgroup's anon to 0.00 MiB) shows the largest single
    # consumer in every kill was what the agent's Bash tool RAN — an npm
    # test/build/lint chain at 315-694 MiB, more than either concurrent turn
    # beside it. In one event only TWO of the four permitted turns were even
    # running.
    #
    #   mem_limit(C) = 100 + 450*C + 700*max(1, ceil(C/4)) + 100   MiB
    #                  base   turns  one heavy tool run       page cache
    #
    # 2700m at the concurrency-4 default below. Full derivation lives in
    # lazaretto's docs/PER_TENANT_CONTAINER_PLAN.md section 7a;
    # docs/vm-sizing-and-provisioning.md sizes the HOST these add up on.
    #
    # provisioners/lazaretto-tenant.sh computes all of these from the tenant's
    # --concurrency (1-2 for a solo tenant, 4 for a team) and overrides every
    # default here; the defaults serve the shared catalog deployment and PR
    # sandboxes, which run at concurrency 4.
    mem_limit: ${LAZARETTO_MEM_LIMIT:-2700m}
    # mem_limit plus an equal amount of swap, stated rather than left to
    # Docker's identical 2x default — because setting this EQUAL to mem_limit
    # is runc's signal to disable swap outright (it writes
    # memory.swap.max=0). `docker update --memory Xg --memory-swap Xg`, the
    # obvious way to widen a ceiling during an incident, therefore removes the
    # container's shock absorber at the same moment; that is what happened to
    # qualitech, leaving it the only one of four backends with swap disabled.
    #
    # Swap is what makes memory pressure survivable rather than lethal here: a
    # turn burns 0.5% CPU, spending ~99.5% of its wall time blocked on API
    # round-trips, so concurrent heaps are cold and evict cheaply. THE VM MUST
    # ACTUALLY HAVE SWAP — see docs/vm-sizing-and-provisioning.md.
    memswap_limit: ${LAZARETTO_MEMSWAP_LIMIT:-5400m}
    # Part of the memory budget above, not fairness dressing. Node reads the
    # cgroup CPU quota in os.availableParallelism(), and every JS toolchain an
    # agent might invoke sizes its worker pool from it: jest runs
    # availableParallelism-1 workers, so an uncapped container on a 4-vCPU
    # host runs three at ~180 MiB each. Verified on the dev host: uncapped
    # reports 4, --cpus 2 reports 2, --cpus 1.5 reports 1. At 2, that jest run
    # uses one worker and the heavy-tool term falls from ~640 MiB to ~250 — a
    # larger saving than any plausible increase to mem_limit, and what keeps
    # the "one heavy tool run at a time" assumption honest.
    cpus: ${LAZARETTO_CPUS:-2}
    # Fork-bomb guard: one runaway session should not be able to take the host
    # down with it. Generous next to real usage — a prod container running two
    # turns, two interactive terminals and a full npm test peaked at 129 pids.
    pids_limit: ${LAZARETTO_PIDS_LIMIT:-1024}
    environment:
      FRONTEND_ORIGIN: https://${SUBDOMAIN:-lazaretto}.${DOMAIN}
      # backend/src/mcp-servers/mcp-oauth-config.ts. This backend's own
      # externally-reachable origin -- NOT FRONTEND_ORIGIN above, which is
      # the frontend's -- used as the redirect_uri sent to a remote MCP
      # server's authorization server when connecting one via OAuth. Same
      # ${SUBDOMAIN}-api.${DOMAIN} host the traefik routers below already
      # route to, so it's always right for the persistent deployment, every
      # PR sandbox, and every per-tenant instance without any per-invocation
      # override.
      LAZARETTO_PUBLIC_API_ORIGIN: https://${SUBDOMAIN:-lazaretto}-api.${DOMAIN}
      # backend/src/cli-agents/cli-runtime.service.ts; unset there means 4.
      CLI_MAX_CONCURRENT: ${LAZARETTO_CLI_MAX_CONCURRENT:-4}
      # backend/src/cli-agents/cli-runtime.service.ts; unset there means a
      # 5-minute wall-clock timeout per turn, with no allowance for time
      # spent inside the CLI's own retry/backoff on an Anthropic API 429 --
      # that wait counts fully against the same budget as active work, so a
      # turn that hits rate limiting can be killed for "running too long"
      # while it was actually just waiting. Raised to 3 hours across every
      # tenant so a turn only dies for genuinely running away, not for
      # absorbing a retry.
      CLI_TURN_TIMEOUT_MS: ${LAZARETTO_TURN_TIMEOUT_MS:-10800000}
      # AES-256-GCM master key for stored credentials (SSH keys, GitHub/npm
      # tokens). Declared in catalog.yaml's generated_secrets and generated
      # once — per app for a manifest deployment, per TENANT for a per-tenant
      # instance, so one tenant's stored credentials are not decryptable with
      # another's. Legitimately empty on a deployment that predates the
      # feature: backend/src/common/secret-crypto.ts validates the format at
      # boot only when set, and the Credentials feature is simply unreachable
      # without it rather than crashing the whole backend.
      LAZARETTO_CREDENTIALS_KEY: ${LAZARETTO_CREDENTIALS_KEY:-}
      # Deliberately unconditional, not ${SUBDOMAIN}-toggled: this fragment
      # is only ever invoked behind Traefik + oauth2-proxy-lazaretto (never
      # bare local dev, which instead runs `npm run start:dev` + Vite
      # directly per lazaretto's own docs/USER_MANAGEMENT_OIDC_ZITADEL.md)
      # — every invocation, persistent or PR sandbox, gets a forwarded
      # token because forwardAuth gates both routers below unconditionally
      # too. Safe to require auth here without a per-invocation switch.
      AUTH_MODE: required
      ZITADEL_ISSUER_URL: https://auth.${DOMAIN}
      # The issuer alone is shared by every app in the platform's one Zitadel
      # Project (catalog.yaml: needs_oidc), so the backend also pins `aud` to
      # its own client id — same value oauth2-proxy-lazaretto already uses,
      # generated by bin/quarantine's OIDC_CLIENT_ID_<APP> wiring off
      # catalog.yaml, never a second credential. Without this, a token
      # verified for a different app on the same Zitadel instance would also
      # verify here. See lazaretto's docs/USER_MANAGEMENT_OIDC_ZITADEL.md.
      ZITADEL_CLIENT_ID: ${OIDC_CLIENT_ID_LAZARETTO}
    healthcheck:
      # 127.0.0.1, not localhost: this image's /etc/hosts resolves
      # "localhost" to ::1 as well as 127.0.0.1, and wget tries that first —
      # Node's HOST=0.0.0.0 binds IPv4 only, so the IPv6 attempt gets
      # "Connection refused" even though the app is perfectly healthy on
      # IPv4 (confirmed empirically: a real PR-sandbox test reported
      # unhealthy while curl from another container succeeded the whole
      # time — see git history for this line).
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3031/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    labels:
      - traefik.enable=true
      - traefik.http.services.${SUBDOMAIN:-lazaretto}-backend.loadbalancer.server.port=3031
      - traefik.http.routers.${SUBDOMAIN:-lazaretto}-api.rule=Host(`${SUBDOMAIN:-lazaretto}-api.${DOMAIN}`)
      - traefik.http.routers.${SUBDOMAIN:-lazaretto}-api.entrypoints=websecure
      - traefik.http.routers.${SUBDOMAIN:-lazaretto}-api.tls=true
      - traefik.http.routers.${SUBDOMAIN:-lazaretto}-api.service=${SUBDOMAIN:-lazaretto}-backend
      # errors outer, auth inner: oauth2-errors must sit outside oauth2-auth
      # so it can catch the 401 forwardAuth short-circuits with — reversed,
      # that 401 would hit the browser directly with no redirect to sign-in
      # (see apps/third-party/uptime-kuma/compose.yaml's identical ordering
      # note). Both sides are ${SUBDOMAIN}-templated: this invocation's own
      # oauth2-proxy-${SUBDOMAIN:-lazaretto} instance (infra/edge/
      # oauth2-proxy/compose.yaml) is what actually answers for THIS
      # router's host, not a fixed shared one.
      - traefik.http.routers.${SUBDOMAIN:-lazaretto}-api.middlewares=oauth2-errors-${SUBDOMAIN:-lazaretto},oauth2-auth-${SUBDOMAIN:-lazaretto}

      # CORS preflight bypass: a browser's OPTIONS preflight never carries
      # credentials (Fetch spec — true regardless of the real request's own
      # credentials: 'include'), so forwardAuth above always sees it as
      # unauthenticated and answers with oauth2-errors' 401->302 rewrite. A
      # redirect response to a preflight is something browsers categorically
      # refuse to follow ("Redirect is not allowed for a preflight
      # request"), which fails the *real* request before it's ever sent —
      # confirmed live: every cross-origin fetch from ${SUBDOMAIN:-lazaretto}.
      # ${DOMAIN} to this -api host failed this way. This second router
      # matches OPTIONS specifically and skips both oauth2 middlewares
      # entirely, going straight to the backend service — lazaretto-backend's
      # own main.ts already calls app.enableCors({..., credentials: true}),
      # it just never got a chance to answer before this router existed.
      # Higher priority than the router above so it wins for OPTIONS on the
      # same host; the actual GET/POST/etc. traffic is untouched and still
      # goes through forwardAuth via that other router.
      - traefik.http.routers.${SUBDOMAIN:-lazaretto}-api-preflight.rule=Host(`${SUBDOMAIN:-lazaretto}-api.${DOMAIN}`) && Method(`OPTIONS`)
      - traefik.http.routers.${SUBDOMAIN:-lazaretto}-api-preflight.entrypoints=websecure
      - traefik.http.routers.${SUBDOMAIN:-lazaretto}-api-preflight.tls=true
      - traefik.http.routers.${SUBDOMAIN:-lazaretto}-api-preflight.priority=200
      - traefik.http.routers.${SUBDOMAIN:-lazaretto}-api-preflight.service=${SUBDOMAIN:-lazaretto}-backend

      # Auth failures on a browser fetch must stay CORS-readable.
      #
      # The preflight router above fixed OPTIONS. The *authenticated* GET is
      # fine too — the backend answers with its own CORS headers. What was
      # left broken is the third case: an unauthenticated GET. oauth2-errors
      # rewrites forwardAuth's 401 into a 302 fetched from /oauth2/sign_in,
      # and that redirect carries NO Access-Control-Allow-Origin. A browser
      # refuses to follow a cross-origin redirect it cannot read, so the
      # fetch rejects with an opaque CORS error rather than a 401 — the app
      # cannot tell "you are logged out" from "the network died".
      #
      # Confirmed live against lazaretto-api.dev.quarantine.al: OPTIONS
      # returns 204 with correct CORS headers, an unauthenticated GET returns
      # 302 with none at all. That is how lazaretto's frontend silently fell
      # back to its hardcoded capability table and stopped showing the MCP
      # picker for Ollama, with nothing logged anywhere.
      #
      # This router matches only what a browser fetch/XHR sends
      # (Sec-Fetch-Mode: cors — a top-level navigation sends `navigate`, and
      # curl sends nothing), so a human opening an -api URL still gets the
      # normal sign-in bounce. It drops oauth2-errors and keeps oauth2-auth,
      # so forwardAuth's 401 is returned as a 401, and wraps the chain in a
      # headers middleware that puts the CORS pair back on it.
      #
      # customresponseheaders SETS rather than appends, so on a successful
      # response it overwrites the backend's identical values instead of
      # producing the duplicate Access-Control-Allow-Origin a browser would
      # itself reject. Vary is deliberately left alone — the backend's own
      # value there is richer than anything worth restating here.
      #
      # Below the preflight router's 200 so OPTIONS still wins (a preflight
      # also carries Sec-Fetch-Mode: cors), above the plain -api router.
      - traefik.http.middlewares.${SUBDOMAIN:-lazaretto}-api-cors.headers.customresponseheaders.Access-Control-Allow-Origin=https://${SUBDOMAIN:-lazaretto}.${DOMAIN}
      - traefik.http.middlewares.${SUBDOMAIN:-lazaretto}-api-cors.headers.customresponseheaders.Access-Control-Allow-Credentials=true
      - traefik.http.routers.${SUBDOMAIN:-lazaretto}-api-fetch.rule=Host(`${SUBDOMAIN:-lazaretto}-api.${DOMAIN}`) && Header(`Sec-Fetch-Mode`, `cors`)
      - traefik.http.routers.${SUBDOMAIN:-lazaretto}-api-fetch.entrypoints=websecure
      - traefik.http.routers.${SUBDOMAIN:-lazaretto}-api-fetch.tls=true
      - traefik.http.routers.${SUBDOMAIN:-lazaretto}-api-fetch.priority=150
      - traefik.http.routers.${SUBDOMAIN:-lazaretto}-api-fetch.middlewares=${SUBDOMAIN:-lazaretto}-api-cors,oauth2-auth-${SUBDOMAIN:-lazaretto}
      - traefik.http.routers.${SUBDOMAIN:-lazaretto}-api-fetch.service=${SUBDOMAIN:-lazaretto}-backend

  lazaretto-frontend:
    image: ghcr.io/quarantineal/lazaretto-frontend:${LAZARETTO_VERSION:-CHANGEME}
    container_name: quarantine-${SUBDOMAIN:-lazaretto}-frontend
    restart: unless-stopped
    profiles: [lazaretto]
    depends_on:
      - lazaretto-backend
    networks:
      - edge
    labels:
      - traefik.enable=true
      - traefik.http.services.${SUBDOMAIN:-lazaretto}-frontend.loadbalancer.server.port=80
      - traefik.http.routers.${SUBDOMAIN:-lazaretto}.rule=Host(`${SUBDOMAIN:-lazaretto}.${DOMAIN}`)
      - traefik.http.routers.${SUBDOMAIN:-lazaretto}.entrypoints=websecure
      - traefik.http.routers.${SUBDOMAIN:-lazaretto}.tls=true
      # Explicit low priority: this router's bare Host() rule would
      # otherwise also match /oauth2/* paths on this host. It must lose to
      # THIS invocation's own oauth2-proxy-${SUBDOMAIN:-lazaretto} router
      # (priority=100, PathPrefix `/oauth2/`, infra/edge/oauth2-proxy/
      # compose.yaml) or sign-in/callback requests would be swallowed here
      # instead.
      - traefik.http.routers.${SUBDOMAIN:-lazaretto}.priority=10
      - traefik.http.routers.${SUBDOMAIN:-lazaretto}.middlewares=oauth2-errors-${SUBDOMAIN:-lazaretto},oauth2-auth-${SUBDOMAIN:-lazaretto}
      - traefik.http.routers.${SUBDOMAIN:-lazaretto}.service=${SUBDOMAIN:-lazaretto}-frontend

networks:
  edge:
    external: true

volumes:
  lazaretto-data:
