# environments/<env>/manifest.yaml — desired state for this environment.
#
# `quarantine app add <name> [--version v]` and `quarantine app remove
# <name>` are the supported way to edit this file; it's plain YAML, so
# hand-editing works too as long as you follow with `quarantine start` to
# reconcile. Every `name` here must exist in catalog.yaml at the repo root.
#
# `quarantine start` reads this list to:
#   - export <APP>_VERSION for each entry (e.g. name: uptime-kuma -> UPTIME_KUMA_VERSION)
#   - pass `--profile <name>` to compose for each entry, activating that
#     app's services in the assembled environments/<env>/compose.yaml
#   - run provisioners/postgres.sh and provisioners/zitadel.sh for any
#     entry whose catalog.yaml record sets needs_db / needs_oidc
#
# A fresh environment starts with no apps — core (Traefik, Postgres,
# Zitadel) comes up regardless. Add apps once the environment is
# confirmed healthy:
#
#   quarantine app add uptime-kuma --version 1.2.3
#   quarantine start
#
# gitops: true starts Komodo (GitOps continuous deployment) alongside core
# infra. There's no CLI flag for this — hand-edit it in, then
# `quarantine start` to apply. See docs/gitops-prod.md for when you'd want
# this (omit entirely, or leave as `false`, for a plain CLI-managed
# environment — the default and simplest mode).
#
# observability: true starts the otel-collector + SigNoz stack (7 containers,
# ~1.5 GB RAM). OPT-IN: omit it, or leave it false, and `quarantine start`
# simply does not bring it up. It is never STOPPED by this flag — turning
# observability off is two steps, setting this false and then stopping it
# yourself, so that a routine `quarantine start` can't tear down a stack
# somebody brought up by hand to debug something. `quarantine status` still
# lists it and `quarantine destroy` still removes it either way.
apps:
  - name: lazaretto
    version: dev
  - name: searxng
observability: false
