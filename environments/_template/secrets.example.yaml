# environments/_template/secrets.example.yaml
#
# PLAINTEXT example — this file is never encrypted, never copied as-is
# into a real environment, and never read as a literal credential source.
# `quarantine init` reads it ONLY as the list of required keys, then
# writes environments/<env>/secrets.sops.yaml directly in already-encrypted
# form — plaintext must never exist at that path, not even transiently:
#   - restore flow: decrypts real values using an existing age key + an
#     existing secrets.sops.yaml supplied by the operator, matches them
#     against this file's key list, and writes straight to the new
#     environment's encrypted secrets.sops.yaml.
#   - generate flow: fills every "CHANGEME" placeholder's key with a
#     freshly generated credential (lib/common.sh gen_password, Zitadel
#     masterkey, etc.) and encrypts the result directly to
#     secrets.sops.yaml under the rule `quarantine init` adds to
#     .sops.yaml for this environment — the plaintext values only ever
#     exist in memory/tmpfs during that step (see secrets_decrypt_to_tmpfs
#     in lib/common.sh for the equivalent pattern used when reading
#     secrets back out later). "CHANGEME-supplied-at-init" values are the
#     one exception: they can't be auto-generated (the operator provides
#     them — e.g. a real Cloudflare API token); "CHANGEME-captured-*"
#     values are left as empty strings until a later step fills them in
#     (Zitadel provisioning, first-boot bootstrap).
#
# This exact key list is cross-checked against every ${VAR} referenced
# across infra/*/compose.yaml and apps/*/*/compose.yaml — see
# bin/quarantine's ENV_VAR_MAP for the mapping from each key here to the
# compose-facing variable name it becomes in the generated .env file.
#
# Provisioners (provisioners/postgres.sh, provisioners/zitadel.sh) write
# generated per-app credentials back into secrets.sops.yaml the first time
# they run, via `secrets_set` (lib/common.sh) — so the file always reflects
# reality and the environment is reproducible from "repo + age key" alone.
#
# Keys with hyphens (e.g. uptime-kuma) must be addressed with bracket
# notation in yq/sops expressions: .apps["uptime-kuma"].oidc_client_secret

core:
  postgres:
    admin_password: "CHANGEME-generated-at-init"
  zitadel:
    masterkey: "CHANGEME-32-char-generated-at-init"
    admin_password: "CHANGEME-generated-at-init"
    db_password: "CHANGEME-generated-at-init"
    provisioner_pat: "CHANGEME-captured-at-first-start"
  traefik:
    cloudflare_api_token: "CHANGEME-supplied-at-init"
  oauth2_proxy:
    cookie_secret: "CHANGEME-generated-at-init"
  github_runner:
    # NOT in REQUIRED_SECRET_KEYS on purpose: unlike everything else under
    # core:, this is only needed by an environment whose compose.yaml
    # actually includes infra/ci/github-runner/ (added by hand per
    # environment, never via _template/ — see that fragment's own
    # comment), so `quarantine init` must not force every environment to
    # supply it. Left empty by generate_secrets (same "legitimately empty
    # until a later step" treatment as apps.uptime-kuma.oidc_* below); set
    # the real value for each such environment individually via
    # `secrets_edit` (lib/common.sh) once that environment exists — every
    # environment with a runner has its own PAT, encrypted with its own
    # age key, never shared across environments. A durable GitHub PAT
    # (org-level, self-hosted-runner-write) — NOT a short-lived
    # registration token — since the runner image uses this to mint a
    # fresh registration token on every restart.
    pat: "CHANGEME-set-manually-via-secrets_edit-once-this-env-has-a-runner"
  ghcr:
    # NOT in REQUIRED_SECRET_KEYS on purpose (same treatment as
    # github_runner.pat above): only needed for ad hoc `quarantine start`/
    # `app start` runs directly on the host — see ensure_ghcr_login
    # (lib/common.sh) for why. Set via `secrets_edit` once per environment;
    # a classic GitHub PAT with read:packages scope, tied to an account
    # with access to the QuarantineAl org's packages.
    pull_username: "CHANGEME-set-manually-via-secrets_edit-once-needed"
    pull_token: "CHANGEME-set-manually-via-secrets_edit-once-needed"

apps:
  lazaretto:
    # consumed by the oauth2-proxy-lazaretto sidecar, not lazaretto's own
    # backend directly — see catalog.yaml's notes for this entry
    oidc_client_id: "CHANGEME-captured-from-zitadel-at-provision-time"
    oidc_client_secret: "CHANGEME-captured-from-zitadel-at-provision-time"
  uptime-kuma:
    # consumed by the oauth2-proxy sidecar, not Uptime Kuma itself —
    # see catalog.yaml's notes for this entry
    oidc_client_id: "CHANGEME-captured-from-zitadel-at-provision-time"
    oidc_client_secret: "CHANGEME-captured-from-zitadel-at-provision-time"
  vaultwarden:
    # consumed DIRECTLY by Vaultwarden's own native SSO support (no
    # oauth2-proxy sidecar for this one) — see catalog.yaml's notes
    oidc_client_id: "CHANGEME-captured-from-zitadel-at-provision-time"
    oidc_client_secret: "CHANGEME-captured-from-zitadel-at-provision-time"
    # Auto-generated (catalog.yaml generated_secrets, alnum32) the first
    # time `quarantine start` reconciles vaultwarden — same treatment as
    # the Zitadel masterkey and Postgres admin password: a random secret
    # at rest in this SOPS-encrypted file. /admin is reachable from the
    # public internet (unlike those two), so production deployments
    # should upgrade this to an Argon2 PHC hash once vaultwarden is
    # running: generate one with
    # `docker run --rm -it vaultwarden/server /vaultwarden hash`, then
    # overwrite this value with the resulting $argon2id$... string via
    # `secrets_edit` and restart vaultwarden. See
    # apps/third-party/vaultwarden/compose.yaml's own comment on
    # ADMIN_TOKEN for why that's worth doing here specifically.
    admin_token: "CHANGEME-generated-on-first-start"
