# catalog.yaml — the registry of every app `quarantine app add` knows how to
# deploy. This file is metadata ONLY: nothing app-specific is hardcoded in
# bin/quarantine or provisioners/*.sh. Both read this file at runtime to
# decide what to provision.
#
# Field reference:
#   name          matches the compose `profile` name and the manifest.yaml
#                 entry; also the basis for exported <APP>_VERSION vars
#                 (upper-cased, hyphens -> underscores) and injected
#                 DATABASE_URL_<APP> / OIDC_CLIENT_ID_<APP> / etc. vars.
#   kind          "core" (always on, not user-removable) or "app" (third
#                 party, catalog-managed via `quarantine app add/remove`).
#   compose_path  path to the compose fragment, relative to repo root.
#   subdomain     the Traefik Host() label prefix; full host is
#                 <subdomain>.${DOMAIN}.
#   needs_db      if true, `provisioners/postgres.sh` creates a database +
#                 role named after `name` (hyphens -> underscores) before
#                 the app starts.
#   needs_oidc    if true, `provisioners/zitadel.sh` creates a Zitadel
#                 project + OIDC client before the app starts, and the
#                 CLI injects OIDC_CLIENT_ID_<APP> / OIDC_CLIENT_SECRET_<APP>.
#   oidc_redirect_uris
#                 redirect URIs registered on the OIDC client. Only present
#                 when needs_oidc is true.
#   notes         free-text caveats surfaced by `quarantine app add` and in
#                 docs/adding-an-app.md.

apps:
  - name: lazaretto
    kind: app
    compose_path: apps/first-party/lazaretto/compose.yaml
    subdomain: lazaretto
    needs_db: false
    needs_oidc: true
    oidc_redirect_uris:
      - "https://lazaretto.${DOMAIN}/oauth2/callback"
    notes: >-
      Two-origin app: frontend at ${subdomain}.${DOMAIN}, backend/API at
      ${subdomain}-api.${DOMAIN} — the second hostname is hardcoded in the
      compose fragment (SUBDOMAIN-templated), not derived from this one
      subdomain field. The frontend image has its API URL baked in at CI
      build time (Vite loads frontend/.env.production, not a build ARG —
      see that file's own Dockerfile comment), pointed at this
      environment's -api hostname by the calling CI workflow. The platform's
      first multi-origin OIDC consumer: the oauth2-proxy-lazaretto instance
      (infra/edge/oauth2-proxy/compose.yaml) sets OAUTH2_PROXY_COOKIE_DOMAINS
      to the shared parent domain so its cookie is valid on both hostnames,
      and forwardAuth gates both of this app's routers wholesale — no
      unauthenticated path, unlike uptime-kuma's public/admin split (own
      ARCHITECTURE.md-documented "no auth" gap this closes). Only the
      persistent host's callback is registered above — PR sandboxes
      (pr-<n>-lazaretto, see docs/runners-and-sandboxing.md) ride the same
      shared Application/cookie rather than getting their own redirect URI;
      see docs/adding-oidc-to-your-app.md for the full recipe and
      docs/USER_MANAGEMENT_OIDC_ZITADEL.md (in the lazaretto repo) for the
      app-side JWT verification this backs.

  - name: uptime-kuma
    kind: app
    compose_path: apps/third-party/uptime-kuma/compose.yaml
    subdomain: status
    needs_db: false
    needs_oidc: true
    oidc_redirect_uris:
      - "https://status.${DOMAIN}/oauth2/callback"
    notes: >-
      Uptime Kuma itself has no native OIDC support — the OIDC client this
      entry provisions is consumed by an oauth2-proxy sidecar (not Uptime
      Kuma directly), which forward-auth-protects the admin UI while public
      status-page paths stay unauthenticated on the same host. Monitors run
      from inside this host only — an external uptime probe is a separate,
      out-of-scope concern (see docs/architecture.md).

  - name: portainer
    kind: app
    compose_path: apps/third-party/portainer/compose.yaml
    subdomain: portainer
    needs_db: false
    needs_oidc: false
    notes: >-
      Internal container-management UI (start/stop, CPU/memory/disk/network
      stats, image updates) — added to both dev and prod, one instance per
      environment, never shared. Local admin auth for now, set via
      Portainer's own first-login UI (no env var bootstraps a password the
      way Komodo's did); Portainer CE does support pointing its login
      screen at a generic OIDC provider directly (no oauth2-proxy needed),
      which could front it with Zitadel later by flipping needs_oidc to
      true — deferred since the current small number of trusted operators
      doesn't need it yet.
