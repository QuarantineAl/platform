# catalog.yaml — the registry of every app `quarantine app add` knows how to
# deploy. This file is metadata ONLY: nothing app-specific is hardcoded in
# bin/quarantine or provisioners/*.sh. Both read this file at runtime to
# decide what to provision.
#
# Field reference:
#   name          matches the compose `profile` name and the manifest.yaml
#                 entry; also the basis for exported <APP>_VERSION vars
#                 (upper-cased, hyphens -> underscores) and injected
#                 DATABASE_URL_<APP> / OIDC_CLIENT_ID_<APP> / etc. vars.
#   kind          "core" (always on, not user-removable) or "app" (third
#                 party, catalog-managed via `quarantine app add/remove`).
#   compose_path  path to the compose fragment, relative to repo root.
#   subdomain     the Traefik Host() label prefix; full host is
#                 <subdomain>.${DOMAIN}.
#   needs_db      if true, `provisioners/postgres.sh` creates a database +
#                 role named after `name` (hyphens -> underscores) before
#                 the app starts.
#   needs_oidc    if true, `provisioners/zitadel.sh` creates a Zitadel
#                 project + OIDC client before the app starts, and the
#                 CLI injects OIDC_CLIENT_ID_<APP> / OIDC_CLIENT_SECRET_<APP>.
#   oidc_redirect_uris
#                 redirect URIs registered on the OIDC client. Only present
#                 when needs_oidc is true.
#   generated_secrets
#                 optional list of app-owned secrets the platform generates
#                 and persists itself, rather than an operator supplying one.
#                 Each entry is {key, env, generator}: `key` is where the
#                 value lives in secrets.sops.yaml (under .apps[<name>] for a
#                 manifest deployment, or under .tenants[<tenant>] for a
#                 per-tenant instance), `env` is the variable the app's
#                 compose fragment reads, and `generator` is one of hex32 or
#                 alnum32 (see gen_secret in lib/common.sh).
#
#                 Generation is ONE-WAY and idempotent: a value that already
#                 exists is never regenerated. That is not a nicety — these
#                 key application data at rest, and minting a fresh one makes
#                 everything encrypted under the old one permanently
#                 unreadable.
#   notes         free-text caveats surfaced by `quarantine app add` and in
#                 docs/adding-an-app.md.

apps:
  - name: lazaretto
    kind: app
    compose_path: apps/first-party/lazaretto/compose.yaml
    subdomain: lazaretto
    needs_db: false
    needs_oidc: true
    oidc_redirect_uris:
      - "https://lazaretto.${DOMAIN}/oauth2/callback"
    generated_secrets:
      # AES-256-GCM master key for the Credentials feature (SSH keys, GitHub
      # tokens, npm tokens) — backend/src/common/secret-crypto.ts reads it as
      # LAZARETTO_CREDENTIALS_KEY and requires exactly 32 bytes of hex.
      # Per-tenant instances get their own key rather than sharing this one,
      # so one tenant's stored credentials are not decryptable with another's.
      - key: credentials_key
        env: LAZARETTO_CREDENTIALS_KEY
        generator: hex32
    notes: >-
      Two-origin app: frontend at ${subdomain}.${DOMAIN}, backend/API at
      ${subdomain}-api.${DOMAIN} — the second hostname is hardcoded in the
      compose fragment (SUBDOMAIN-templated), not derived from this one
      subdomain field. The frontend image has its API URL baked in at CI
      build time (Vite loads frontend/.env.production, not a build ARG —
      see that file's own Dockerfile comment), pointed at this
      environment's -api hostname by the calling CI workflow. The platform's
      first multi-origin, PR-sandboxed OIDC consumer: the
      oauth2-proxy-lazaretto instance (infra/edge/oauth2-proxy/compose.yaml)
      is ${SUBDOMAIN}-templated (one per open PR sandbox plus the
      persistent deployment), each sets OAUTH2_PROXY_COOKIE_DOMAINS to the
      shared parent domain so its cookie is valid across both of that
      instance's hostnames, and forwardAuth gates both of this app's
      routers wholesale — no unauthenticated path, unlike uptime-kuma's
      public/admin split (own ARCHITECTURE.md-documented "no auth" gap this
      closes). Only the persistent host's callback is registered above —
      every PR sandbox (pr-<n>-lazaretto, see docs/runners-and-sandboxing.md)
      shares the ONE Zitadel Application (same client_id/secret) but
      registers and later deregisters its OWN redirect URI on it via
      provisioners/zitadel.sh's add-redirect/remove-redirect modes, called
      from QuarantineAl/.github's pr-sandbox-up.yml/pr-sandbox-down.yml as
      the sandbox opens/closes. See docs/adding-oidc-to-your-app.md for the
      full recipe and docs/USER_MANAGEMENT_OIDC_ZITADEL.md (in the lazaretto
      repo) for the app-side JWT verification this backs.

  - name: uptime-kuma
    kind: app
    compose_path: apps/third-party/uptime-kuma/compose.yaml
    subdomain: status
    needs_db: false
    needs_oidc: true
    oidc_redirect_uris:
      - "https://status.${DOMAIN}/oauth2/callback"
    notes: >-
      Uptime Kuma itself has no native OIDC support — the OIDC client this
      entry provisions is consumed by an oauth2-proxy sidecar (not Uptime
      Kuma directly), which forward-auth-protects the admin UI while public
      status-page paths stay unauthenticated on the same host. Monitors run
      from inside this host only — an external uptime probe is a separate,
      out-of-scope concern (see docs/architecture.md).

  - name: portainer
    kind: app
    compose_path: apps/third-party/portainer/compose.yaml
    subdomain: portainer
    needs_db: false
    needs_oidc: false
    notes: >-
      Internal container-management UI (start/stop, CPU/memory/disk/network
      stats, image updates) — added to both dev and prod, one instance per
      environment, never shared. Local admin auth for now, set via
      Portainer's own first-login UI (no env var bootstraps a password the
      way Komodo's did); Portainer CE does support pointing its login
      screen at a generic OIDC provider directly (no oauth2-proxy needed),
      which could front it with Zitadel later by flipping needs_oidc to
      true — deferred since the current small number of trusted operators
      doesn't need it yet.

  - name: searxng
    kind: app
    compose_path: apps/third-party/searxng/compose.yaml
    needs_db: false
    needs_oidc: false
    generated_secrets:
      # SearXNG signs its own session/state with this. Delivered as an env
      # var, never written into settings.yml — searx/settings_defaults.py
      # declares secret_key with environ_name='SEARXNG_SECRET' — so it stays
      # out of this repo and off the host's disk. Rotating it is harmless:
      # nothing is encrypted at rest with it, unlike lazaretto's
      # credentials_key.
      - key: searxng_secret
        env: SEARXNG_SECRET
        generator: alnum32
    notes: >-
      Self-hosted metasearch, added so Lazaretto's Ollama tool loop has a
      web-search tool whose queries never leave this host — the alternative
      being a third-party search API key or Ollama's hosted endpoint, both
      of which send every query off the infrastructure. Deliberately has NO
      subdomain: it is the one catalog app with no Traefik router and no
      oauth2-proxy, because nothing human browses it. Its only client is the
      MCP search server Lazaretto spawns, which reaches it over the internal
      edge network at http://quarantine-searxng:8080. That containment is
      what makes disabling SearXNG's bot limiter safe (the limiter 403s
      exactly the programmatic traffic we want) — read
      apps/third-party/searxng/settings.yml before giving this a Host()
      rule. One shared instance serves the shared Lazaretto and every
      per-tenant instance: search is stateless and SearXNG logs no queries
      by default, so there is nothing tenant-specific to keep apart.
