# Narrow, single-purpose guard: fail if any file named secrets.sops.yaml
# anywhere in the repo is NOT actually SOPS-encrypted (i.e. is missing the
# `sops:` metadata stanza SOPS adds on encryption). This is the second
# backstop — alongside the .gitignore patterns for decrypted intermediates
# — against a plaintext secrets file ever landing in git history.
#
# The other half of CI — shellcheck and docker compose config validation —
# lives in lint-and-validate.yml. This workflow stays single-purpose on its
# own, narrower trigger surface (secrets encryption is a hard gate; lint
# failures are not).
name: verify-secrets-encrypted

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fail on any unencrypted secrets.sops.yaml
        shell: bash
        run: |
          set -euo pipefail
          fail=0
          while IFS= read -r -d '' f; do
            if ! grep -q '^sops:' "$f"; then
              echo "::error file=${f}::found secrets.sops.yaml without a sops: metadata stanza — this file is not actually encrypted"
              fail=1
            fi
          done < <(find . -type f -name 'secrets.sops.yaml' -not -path './.git/*' -print0)
          if [ "$fail" -ne 0 ]; then
            exit 1
          fi
          echo "OK: every secrets.sops.yaml found is SOPS-encrypted (or none exist yet)"
