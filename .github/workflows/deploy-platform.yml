name: Deploy platform

# Until this existed, a merge to main reached the hosts only by accident:
# QuarantineAl/.github's deploy-app.yml opens with `git pull --ff-only` in
# /opt/quarantine/repo, so a platform change shipped whenever some *other*
# repo happened to deploy — and `quarantine start` never ran at all, so
# nothing was reconciled. Anything nobody pulled by hand simply sat in main.
#
# Unlike an app deploy this builds and pushes nothing. Platform ships shell
# and compose fragments, and the thing being deployed already lives at
# /opt/quarantine/repo on the runner's own host (the runner container
# bind-mounts /opt/quarantine at an identical path and runs as uid 0). The
# `git pull` IS the deploy; `quarantine start` is what makes it take effect.

on:
  push:
    branches: [main]
  # prod is deliberately NOT deployed by the push trigger — see the job's
  # `runs-on` for the reasoning. Dispatch it explicitly.
  workflow_dispatch:
    inputs:
      environment:
        description: Which host to reconcile
        type: choice
        options: [dev, prod]
        default: dev

permissions:
  # write + PRs so the reconcile step below can push a branch carrying
  # whatever secrets this host generated, and open a PR for it. It never
  # pushes main — main requires a pull request, and generated secrets should
  # go through one like anything else.
  contents: write
  pull-requests: write

# Serialised per host. `quarantine start` takes a non-blocking `flock -n` on
# the environment (lib/common.sh acquire_lock) and DIES rather than waiting,
# so two overlapping runs would not queue — the second would just fail. Two
# hosts still proceed in parallel: they hold different locks on different
# machines.
concurrency:
  group: deploy-platform-${{ github.event_name == 'workflow_dispatch' && inputs.environment || 'dev' }}
  cancel-in-progress: false

jobs:
  deploy:
    # Only two self-hosted labels exist, `quarantine-dev` and `quarantine-prod`,
    # emitted by the CLI itself (bin/quarantine's RUNNER_LABELS) into the env
    # file the runner compose reads. The label picks the HOST; it does not tell
    # the CLI which environment to act on — that comes from the host's own
    # /opt/quarantine/quarantine.yaml, and there is no --env flag on `start`.
    # So targeting is entirely a matter of which runner picks the job up.
    #
    # A push to main goes to dev only. Auto-reconciling prod is a materially
    # bigger decision than auto-deploying an app: `quarantine start` reconciles
    # traefik, postgres, zitadel and observability, so a bad platform merge
    # would take the identity provider and the database with it, for every
    # tenant at once. Dev running the same code first is the whole point of
    # having dev. To make prod automatic, replace the expression below with
    # a matrix over [dev, prod] — everything else here already works for both.
    runs-on:
      - self-hosted
      - quarantine-${{ github.event_name == 'workflow_dispatch' && inputs.environment || 'dev' }}

    env:
      QUARANTINE_CONFIG_FILE: /opt/quarantine/quarantine.yaml
      QUARANTINE_REPO_PATH: /opt/quarantine/repo
      TARGET_ENV: ${{ github.event_name == 'workflow_dispatch' && inputs.environment || 'dev' }}
      # Load-bearing, and this workflow is the first thing in the org to set
      # it. `quarantine start` reconciles the CI runner pool, and this job is
      # running INSIDE that pool — `up -d runner` would recreate the container
      # executing these very steps, killing the job that asked for it
      # (confirmed empirically as "The operation was canceled"). See the
      # comment at bin/quarantine's QUARANTINE_SKIP_RUNNER check.
      #
      # It is exported, not passed per-command, because `quarantine upgrade`
      # finishes with `exec "$0" start` — the value has to survive that exec.
      QUARANTINE_SKIP_RUNNER: "true"

    steps:
      # No actions/checkout. The code being deployed is the host's own
      # checkout, and a second copy in the runner workspace would be a
      # different tree that `quarantine upgrade` then would not update.

      # Same three tools, same pins, same checksums as
      # QuarantineAl/.github's deploy-app.yml and this repo's install.sh —
      # THREE COPIES NOW, keep them in lockstep. They are installed here
      # rather than assumed because the runner is a bare myoung34/github-
      # runner image: it bind-mounts /opt/quarantine but not /usr/local/bin,
      # so the host's own sops/yq/age are not on this PATH, and
      # bin/quarantine's require_cmd fails without them.
      - name: Install quarantine CLI dependencies
        run: |
          set -euo pipefail
          case "$(uname -m)" in
            x86_64) arch=amd64 ;;
            aarch64|arm64) arch=arm64 ;;
            *) echo "unsupported architecture: $(uname -m)" >&2; exit 1 ;;
          esac

          sops_version="3.13.3"
          yq_version="4.53.3"
          age_version="1.3.1"
          declare -A sops_sha256=( [amd64]="e5bec3346a873ae91d871550f3e698c1aad962aff462a080e40f25fde17fef6b" [arm64]="53b0abacd38ef1b12a66d6c100956691b9cefce018d91f81e73ddf7438b94d77" )
          declare -A yq_sha256=( [amd64]="fa52a4e758c63d38299163fbdd1edfb4c4963247918bf9c1c5d31d84789eded4" [arm64]="578648e463a11c1b6db6010cbf41eafed6bee79466fcffa1bb446672cf7945ea" )
          declare -A age_sha256=( [amd64]="bdc69c09cbdd6cf8b1f333d372a1f58247b3a33146406333e30c0f26e8f51377" [arm64]="c6878a324421b69e3e20b00ba17c04bc5c6dab0030cfe55bf8f68fa8d9e9093a" )

          fetch_verified() {
            local url="$1" expected="$2" dest="$3" tmp actual
            tmp="$(mktemp)"
            curl -fsSL -o "$tmp" "$url"
            actual="$(sha256sum "$tmp" | awk '{print $1}')"
            [[ "$actual" == "$expected" ]] || { echo "checksum mismatch for ${url}: expected ${expected}, got ${actual}" >&2; exit 1; }
            chmod +x "$tmp"
            sudo mv "$tmp" "$dest"
          }

          fetch_verified "https://github.com/getsops/sops/releases/download/v${sops_version}/sops-v${sops_version}.linux.${arch}" "${sops_sha256[$arch]}" /usr/local/bin/sops
          fetch_verified "https://github.com/mikefarah/yq/releases/download/v${yq_version}/yq_linux_${arch}" "${yq_sha256[$arch]}" /usr/local/bin/yq

          age_tmp="$(mktemp -d)"
          age_tarball="${age_tmp}/age.tar.gz"
          curl -fsSL -o "$age_tarball" "https://github.com/FiloSottile/age/releases/download/v${age_version}/age-v${age_version}-linux-${arch}.tar.gz"
          actual="$(sha256sum "$age_tarball" | awk '{print $1}')"
          [[ "$actual" == "${age_sha256[$arch]}" ]] || { echo "checksum mismatch for age tarball: expected ${age_sha256[$arch]}, got ${actual}" >&2; exit 1; }
          tar xzf "$age_tarball" -C "$age_tmp"
          sudo mv "${age_tmp}/age/age" "${age_tmp}/age/age-keygen" /usr/local/bin/
          rm -rf "$age_tmp"

      # The host writes secrets nobody commits. `quarantine start` generates a
      # missing one, writes it into environments/<env>/secrets.sops.yaml, and
      # only logs a reminder; `tenant add`/`upgrade-all` do the same for a
      # per-tenant credentials key. Five further paths write that file with no
      # reminder at all. So the tree goes dirty on its own, and stays dirty.
      #
      # That is not a tidiness problem. Every deploy in the org opens with
      # `git pull --ff-only` in this checkout, so the next commit touching
      # environments/ aborts the pull and fails an unrelated repo's deploy —
      # #43. Worse, a generated key exists ONLY here until it is committed:
      # prod's shared-instance credentials_key sat uncommitted for days, and
      # losing it makes every credential it encrypted permanently unreadable
      # (#47, recovered by hand).
      #
      # This step is the automation of that hand recovery. It deliberately
      # does NOT push main — main requires a pull request, and a host that
      # could push to main could push anything to the repo that configures
      # BOTH hosts. It opens a PR and carries on.
      - name: Reconcile host-generated state into git
        working-directory: ${{ env.QUARANTINE_REPO_PATH }}
        env:
          GH_PUSH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git fetch -q origin main

          # Phase 1 — settle anything already upstream. Once a previous run's PR
          # merges, the host's local edit becomes byte-identical to origin/main,
          # so it can be settled losslessly. That is what makes this
          # self-healing: merge the PR, and the next deploy cleans the tree by
          # itself. `git diff --quiet` against origin/main is the proof, and is
          # the same check used to recover the hosts by hand in #47.
          #
          # `checkout origin/main --`, NOT `checkout --`. They differ in a way
          # that matters on a live host: a bare `checkout --` restores from
          # HEAD, which is still the OLD commit here, so it wipes the generated
          # secret off disk and only gets it back when the merge below lands.
          # Measured: that leaves a window where the host holds no copy of its
          # own key, and a failure inside it means the next `quarantine start`
          # generates a different one and everything encrypted with the old one
          # is unreadable. Checking out origin/main's version writes identical
          # bytes, so the file is never without its secret, and the
          # fast-forward still succeeds because the staged content already
          # equals the merge target.
          restored=0
          while IFS= read -r path; do
            [[ -n "$path" ]] || continue
            if git diff --quiet origin/main -- "$path"; then
              echo "already upstream, settling: ${path}"
              git checkout origin/main -- "$path"
              restored=$(( restored + 1 ))
            fi
          done < <(git diff --name-only -- environments/)
          [[ "$restored" -eq 0 ]] || echo "restored ${restored} file(s) that origin/main already carries"

          # Phase 2 — whatever is left exists only on this host.
          mapfile -t paths < <(
            { git diff --name-only -- environments/
              git ls-files --others --exclude-standard -- environments/
            } | sort -u
          )
          if [[ "${#paths[@]}" -eq 0 ]]; then
            echo "checkout is clean — nothing to reconcile"
            exit 0
          fi
          printf 'host-only state: %s\n' "${paths[@]}"

          # GitHub refuses pushes from a shallow repository, and install.sh
          # clones with --depth 1, so both hosts are shallow. Deepening is
          # one-time and harmless — the repo is small, and it also fixes
          # `git describe` for `quarantine version`.
          if [[ "$(git rev-parse --is-shallow-repository)" == "true" ]]; then
            echo "unshallowing (required before any push)"
            git fetch -q --unshallow origin main
          fi

          # Built with plumbing rather than `git add && git commit`, and this
          # is the crux of the whole step: commit-tree writes an object graph
          # WITHOUT touching HEAD, the index, or the working tree. The host
          # keeps running exactly as it is, still holding the only copy of
          # these secrets, while the copy is safely pushed. A branch-and-
          # commit here would move the file out from under a live deployment
          # the moment we switched back to main.
          #
          # Identity comes from the environment because these hosts have no
          # git identity configured and this must not create one.
          export GIT_AUTHOR_NAME="github-actions[bot]" \
                 GIT_COMMITTER_NAME="github-actions[bot]" \
                 GIT_AUTHOR_EMAIL="41898282+github-actions[bot]@users.noreply.github.com" \
                 GIT_COMMITTER_EMAIL="41898282+github-actions[bot]@users.noreply.github.com"

          tmpindex="$(mktemp -u)"
          git read-tree --index-output="$tmpindex" HEAD
          for path in "${paths[@]}"; do
            blob="$(git hash-object -w "$path")"
            GIT_INDEX_FILE="$tmpindex" git update-index --add --cacheinfo "100644,${blob},${path}"
          done
          tree="$(GIT_INDEX_FILE="$tmpindex" git write-tree)"
          rm -f "$tmpindex"

          branch="host-state/${TARGET_ENV}-${GITHUB_RUN_ID}"
          msg="$(printf '%s\n\n%s\n' \
            "Persist ${TARGET_ENV} host-generated state" \
            "Written by the ${TARGET_ENV} host during a platform deploy and not present in main. Generated secrets exist only on that host until this merges.")"
          commit="$(git commit-tree "$tree" -p HEAD -m "$msg")"

          # The token reaches git through a credential helper reading the
          # environment, so it is never an argument and never lands in a log.
          # The helper text below contains the variable's NAME, not its value.
          # shellcheck disable=SC2016 # must NOT expand here — git runs this
          # helper itself and it reads the token from its own environment
          git -c credential.helper='!f() { echo username=x-access-token; echo "password=${GH_PUSH_TOKEN}"; }; f' \
            push -q origin "${commit}:refs/heads/${branch}"
          echo "pushed ${branch}"

          body="$(
            printf '%s\n\n' "Opened automatically by the ${TARGET_ENV} platform deploy."
            printf '%s\n\n' "These files were written by the ${TARGET_ENV} host and are not in main. Until this merges they exist on that host and nowhere else — if any of them is a newly generated key, losing the host loses everything it encrypts."
            printf '%s\n\n' "Merging also unblocks that host: the next deploy sees its local edit is byte-identical to main and restores it automatically, leaving the checkout clean."
            printf '%s\n' "Files:"
            printf -- "- \`%s\`\n" "${paths[@]}"
          )"

          # yq (installed above) builds the JSON so no value needs hand-
          # escaping; strenv() is this repo's documented idiom for exactly
          # that. The curl config is a file rather than inline flags so the
          # token is never an argument.
          reqdir="$(mktemp -d)"
          export TITLE="Persist ${TARGET_ENV} host-generated state"
          export HEAD_REF="$branch"
          export BODY="$body"
          # shellcheck disable=SC2016 # strenv() is yq syntax, not shell
          yq -n -o=json '{"title": strenv(TITLE), "head": strenv(HEAD_REF), "base": "main", "body": strenv(BODY)}' > "${reqdir}/pr.json"

          {
            printf 'url = "https://api.github.com/repos/%s/pulls"\n' "$GITHUB_REPOSITORY"
            printf 'request = "POST"\n'
            printf 'header = "Authorization: Bearer %s"\n' "$GH_PUSH_TOKEN"
            printf 'header = "Accept: application/vnd.github+json"\n'
            printf 'data = "@%s/pr.json"\n' "$reqdir"
          } > "${reqdir}/curlrc"
          chmod 600 "${reqdir}/curlrc"

          if url="$(curl -fsS --config "${reqdir}/curlrc" | yq -p=json -r '.html_url')"; then
            echo "::warning::This host had uncommitted state; opened ${url} to persist it. Merge it — the next deploy then cleans the checkout automatically."
          else
            echo "::warning::Pushed ${branch} but could not open a PR for it. Open one by hand — that branch holds state that exists nowhere else."
          fi
          rm -rf "$reqdir"

      - name: Record the commit being deployed from
        working-directory: ${{ env.QUARANTINE_REPO_PATH }}
        run: echo "BEFORE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      # `git fetch origin main` + `merge --ff-only origin/main`, then
      # `exec "$0" start`. Preferred over open-coding those here because it
      # also checks the checkout is on main and that the repo the config
      # points at is the same one this CLI is running from — otherwise it
      # would pull code into one tree and re-exec from another.
      - name: Pull and reconcile
        working-directory: ${{ env.QUARANTINE_REPO_PATH }}
        run: ./bin/quarantine upgrade

      # QUARANTINE_SKIP_RUNNER above means a change to the runner's own
      # compose fragment is pulled but never applied, and would otherwise sit
      # there looking deployed until someone wondered why it had no effect.
      # There is no way around it: applying it is what kills the job. Say so
      # loudly instead, and only when the merge actually touched those files.
      - name: Warn if this change needs manual application
        if: always()
        working-directory: ${{ env.QUARANTINE_REPO_PATH }}
        run: |
          set -euo pipefail
          # Compared against a SHA captured before the merge rather than
          # HEAD@{1}: the reflog's previous entry is only the pre-merge commit
          # when the merge actually moved HEAD, so an already-up-to-date run
          # would diff against whatever unrelated operation came last and warn
          # about nothing.
          if [[ -z "${BEFORE_SHA:-}" ]]; then
            echo "no pre-deploy SHA recorded — skipping"; exit 0
          fi
          touched="$(git diff --name-only "$BEFORE_SHA" HEAD -- infra/ci/github-runner/ 2>/dev/null || true)"
          if [[ -n "$touched" ]]; then
            echo "::warning::This deploy changed the CI runner's own compose fragment, which QUARANTINE_SKIP_RUNNER deliberately did not apply. Run 'quarantine start' on this host over SSH to pick it up."
            echo "$touched"
          fi
